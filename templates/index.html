<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ViewSATranscript</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>ViewSATranscript</h1>
    <div class="row row-top">
      <input id="id-input" type="text" placeholder="session id, subagent id, or full path" autofocus />
      <button id="load-btn">Load</button>
      <div class="toggle-group">
        <button class="toggle-btn" data-cat="output" title="Show/hide model output">Output</button>
        <button class="toggle-btn" data-cat="reasoning" title="Show/hide model reasoning">Reasoning</button>
        <button class="toggle-btn" data-cat="user" title="Show/hide user input">User</button>
        <button class="toggle-btn" data-cat="tools" title="Show/hide tool calls">Tools</button>
      </div>
      <span id="status"></span>
    </div>
    <div id="stats-bar" class="stats-grid"></div>
  </header>
  <main id="transcript"><div class="empty">Enter an id above to load a transcript.</div></main>
  <button id="jump-bottom" class="jump-bottom" title="Jump to bottom" hidden>&#8595;</button>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
